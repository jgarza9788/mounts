name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write       # create the release and upload the asset
      id-token: write       # sign the attestation (Sigstore OIDC)
      attestations: write   # store the attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: rustup toolchain install "$(sed -n 's/^channel *= *"\(.*\)"/\1/p' helper/rust-toolchain.toml)" --profile minimal
      - name: Test
        run: cd helper && cargo test --locked
      - name: Build
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          cd helper
          RUSTFLAGS="--remap-path-prefix=$HOME=~ --remap-path-prefix=$GITHUB_WORKSPACE=." cargo build --release --locked
          mkdir -p ../bin && cp target/release/mountsctl ../bin/mountsctl
          sha256sum ../bin/mountsctl
          echo "source commit: $GITHUB_SHA"
      - name: Negative tests
        run: tests/negative.sh
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: bin/mountsctl
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: bin/mountsctl
